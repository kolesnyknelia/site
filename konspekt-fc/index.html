<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <!-- не передаємо адресу конспекту сайтам, на які ведуть посилання -->
  <meta name="referrer" content="no-referrer">
  <title>Конспект · Формула Claude</title>
  <meta name="description" content="Конспект курсу «Формула Claude» Нелі Колесник: товарка з Claude — уроки, промпти й чек-листи в одному місці.">
  <meta name="theme-color" content="#ecebe8">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✳️</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    /* =========================================================
       Конспект курсу «Формула Claude» · Неля Колесник
       Стиль сайту formulaclaude: світлий сірий, тонкі лінії, теракотовий акцент
       Вміст уроків — у js/m*.js, сторінка лише збирає їх
       ========================================================= */
    :root {
      --bg: #ecebe8; --bg-2: #f8f8f6; --sand: #e2e1dd; --ink: #1f1f1f; --ink-2: #4a4a4a; --muted: #7a7a7a;
      --line: #d6d5d1; --acc: #e3b8a3; --acc-l: #f4e8e1; --acc-d: #a9512c; --acc-dd: #7f3a1d;
      --gold: #e7d8b0; --gold-l: #f6f0e0; --gold-d: #9a7a2a; --rose-l: #f5e3e1; --rose-d: #a8473f;
      --code-bg: #232220; --code-ink: #f2f1ee;
      --radius: 6px; --radius-s: 4px;
      --shadow: 0 18px 40px -30px rgba(0, 0, 0, .35);
      --serif: "Cormorant Garamond", Georgia, serif; --sans: "Inter", system-ui, sans-serif;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        --bg: #161615; --bg-2: #1f1f1d; --sand: #2a2a27; --ink: #efeeea; --ink-2: #c4c2bc; --muted: #8f8d87;
        --line: #353531; --acc: #c9805e; --acc-l: #33241d; --acc-d: #e39a76; --acc-dd: #f2bfa5;
        --gold: #5e4f27; --gold-l: #2a2519; --gold-d: #dcc07a; --rose-l: #321f1e; --rose-d: #e8958d;
        --code-bg: #0f0f0e; --code-ink: #ecebe7; color-scheme: dark;
      }
    }
    :root[data-theme="dark"] {
      --bg: #161615; --bg-2: #1f1f1d; --sand: #2a2a27; --ink: #efeeea; --ink-2: #c4c2bc; --muted: #8f8d87;
        --line: #353531; --acc: #c9805e; --acc-l: #33241d; --acc-d: #e39a76; --acc-dd: #f2bfa5;
        --gold: #5e4f27; --gold-l: #2a2519; --gold-d: #dcc07a; --rose-l: #321f1e; --rose-d: #e8958d;
        --code-bg: #0f0f0e; --code-ink: #ecebe7; color-scheme: dark;
    }
    * { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { scroll-behavior: smooth; -webkit-text-size-adjust: 100%; }
    body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.65 var(--sans); }
    a { color: var(--acc-dd); text-underline-offset: 3px; }
    p { margin: 0 0 12px; max-width: 68ch; }
    code { font: 500 .9em var(--mono); background: var(--sand); border-radius: 7px; padding: 2px 7px; overflow-wrap: anywhere; }
    .container { max-width: 1180px; margin: 0 auto; padding: 0 20px; }

    /* ---------- шапка ---------- */
    .top { background: var(--bg-2); border-bottom: 1px solid var(--line); }
    .top .container { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-top: 14px; padding-bottom: 14px; }
    .brand { text-decoration: none; color: var(--ink); line-height: 1.1; }
    .brand b { display: block; font: 600 26px/1 var(--serif); }
    .brand small { color: var(--muted); font-size: 13px; font-weight: 600; }
    .top-right { display: flex; align-items: center; gap: 14px; }
    .overall { display: flex; align-items: center; gap: 10px; font-size: 13px; color: var(--ink-2); font-weight: 600; }
    .ring { --p: 0; width: 44px; height: 44px; border-radius: 50%; display: grid; place-items: center; flex: none;
      background: conic-gradient(var(--acc-d) calc(var(--p) * 1%), var(--line) 0); }
    .ring span { width: 34px; height: 34px; border-radius: 50%; background: var(--bg-2); display: grid; place-items: center; font: 800 11px var(--sans); color: var(--ink); }
    .help { display: inline-flex; align-items: center; gap: 6px; text-decoration: none; font-weight: 700; font-size: 14px; color: var(--ink); background: var(--acc-l); border-radius: 999px; padding: 10px 16px; white-space: nowrap; }
    .help:hover { background: var(--acc); }

    /* ---------- картки блоків ---------- */
    .blocks { position: sticky; top: 0; z-index: 10; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
    .blocks .container { display: flex; gap: 10px; overflow-x: auto; padding-top: 12px; padding-bottom: 12px; scrollbar-width: thin; }
    .bcard { flex: 0 0 auto; min-width: 150px; text-align: left; cursor: pointer; border: 1.5px solid var(--line); background: var(--bg-2); color: var(--ink);
      border-radius: var(--radius-s); padding: 10px 14px 11px; font: inherit; display: grid; gap: 2px; transition: border-color .15s, background .15s, transform .15s; }
    .bcard:hover { transform: translateY(-1px); border-color: var(--acc); }
    .bcard small { font: 700 11px var(--sans); letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
    .bcard b { font-size: 15px; line-height: 1.25; white-space: nowrap; }
    .bcard .mini { height: 4px; border-radius: 4px; background: var(--line); overflow: hidden; margin-top: 6px; }
    .bcard .mini i { display: block; height: 100%; width: 0; background: var(--acc-d); transition: width .3s; }
    .bcard[aria-selected="true"] { background: var(--acc-l); border-color: var(--acc-d); }
    .bcard.done b::after { content: " ✓"; color: var(--acc-d); }
    .bcard:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }

    /* ---------- розкладка ---------- */
    .layout { display: grid; grid-template-columns: minmax(0, 1fr) 270px; gap: 48px; padding-top: 36px; padding-bottom: 90px; }
    main { min-width: 0; }
    .outline { position: sticky; top: 104px; align-self: start; display: grid; gap: 14px; }
    .outline-card { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; }
    .outline-head { display: flex; align-items: center; gap: 12px; }
    .outline-head .ring { width: 52px; height: 52px; }
    .outline-head .ring span { width: 41px; height: 41px; font-size: 12px; }
    .outline-head b { display: block; font-size: 15px; line-height: 1.3; }
    .outline-head small { color: var(--muted); font-size: 13px; }
    .outline nav { display: grid; gap: 2px; }
    .outline nav a { display: flex; gap: 10px; align-items: baseline; text-decoration: none; color: var(--ink-2); font-size: 14px; padding: 7px 10px; border-radius: 10px; line-height: 1.35; }
    .outline nav a i { font: italic 600 16px var(--serif); color: var(--acc-d); min-width: 20px; }
    .outline nav a:hover { background: var(--sand); color: var(--ink); }
    .outline nav a.is-lesson { color: var(--muted); font-size: 12px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; pointer-events: none; padding-top: 12px; }
    .outline .help { justify-content: center; }

    /* ---------- блок ---------- */
    .block { display: grid; grid-template-columns: minmax(0, 1fr); gap: 28px; }
    .intro { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 30px 30px 26px; box-shadow: var(--shadow); position: relative; overflow: hidden; }
    .intro::after { content: attr(data-icon); position: absolute; right: 22px; top: 16px; font-size: 64px; opacity: .9; }
    .eyebrow { font: 700 12px var(--sans); letter-spacing: .12em; text-transform: uppercase; color: var(--acc-d); }
    h1 { font: 600 clamp(34px, 6vw, 54px)/1.05 var(--serif); margin: 10px 0 14px; padding-right: 70px; text-wrap: balance; }
    h1 em { font-style: italic; color: var(--acc-d); }
    .lead { font-size: 18px; color: var(--ink-2); margin: 0; }
    .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 18px; }
    .chip { display: inline-flex; align-items: center; gap: 6px; background: var(--sand); border-radius: 999px; padding: 6px 12px; font-size: 13px; font-weight: 700; color: var(--ink-2); }
    .lesson-title { font: 600 clamp(26px, 4.4vw, 34px)/1.15 var(--serif); margin: 18px 0 -8px; display: flex; gap: 12px; align-items: baseline; }
    .lesson-title small { font: 700 12px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); white-space: nowrap; }

    /* ---------- крок ---------- */
    .step { background: var(--bg-2); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; scroll-margin-top: 110px; }
    .step-head { display: flex; gap: 16px; align-items: flex-start; margin-bottom: 14px; }
    .step-n { font: 600 40px/0.9 var(--serif); color: var(--acc-d); min-width: 48px; }
    .step-head h3 { font: 800 21px/1.3 var(--sans); margin: 2px 0 6px; text-wrap: balance; }
    .step-head .chip { padding: 3px 10px; font-size: 12px; }
    .step h4 { font: 800 16px/1.3 var(--sans); margin: 22px 0 8px; }
    .step ol, .step ul { margin: 0 0 12px; padding-left: 22px; display: grid; gap: 7px; max-width: 68ch; }
    .step li::marker { color: var(--acc-d); font-weight: 800; }
    .rules { list-style: none; padding: 0 !important; display: grid; gap: 10px !important; }
    .rules li { background: var(--bg); border-radius: var(--radius-s); padding: 12px 14px; }
    .rules li b { display: block; }

    /* ---------- підказки ---------- */
    .note { display: grid; grid-template-columns: 30px 1fr; gap: 10px; border-radius: var(--radius-s); padding: 14px 16px; margin: 14px 0; max-width: 72ch; background: var(--acc-l); }
    .note::before { content: "💡"; font-size: 20px; line-height: 1.3; }
    .note.warn { background: var(--gold-l); } .note.warn::before { content: "⚠️"; }
    .note.secret { background: var(--rose-l); } .note.secret::before { content: "🔒"; }
    .note.skip { background: var(--sand); } .note.skip::before { content: "↪"; }
    .note b { display: block; margin-bottom: 2px; }
    .note p { margin: 0; }

    /* ---------- посилання, файли, промпти ---------- */
    .link-row { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; border: 1.5px dashed var(--line); border-radius: var(--radius-s); padding: 10px 12px 10px 16px; margin: 12px 0; max-width: 72ch; }
    .link-row span { flex: 1 1 200px; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
    .link-row span small { display: block; font-weight: 500; color: var(--muted); font-size: 13px; }
    .btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 700 14px/1 var(--sans); padding: 11px 16px; border-radius: 12px; border: 0; cursor: pointer; text-decoration: none; white-space: nowrap; background: var(--acc-d); color: #fff; }
    .btn:hover { background: var(--acc-dd); }
    .btn.soft { background: var(--sand); color: var(--ink); }
    .btn.soft:hover { background: var(--line); }
    .btn:focus-visible { outline: 3px solid var(--acc); outline-offset: 2px; }
    .file { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; background: var(--gold-l); border-radius: var(--radius-s); padding: 14px 16px; margin: 12px 0; max-width: 72ch; }
    .file .ico { font-size: 30px; }
    .file div { flex: 1 1 200px; min-width: 0; }
    .file small { display: block; color: var(--ink-2); font-size: 13px; overflow-wrap: anywhere; }
    .prompt { margin: 12px 0 16px; max-width: 760px; border-radius: var(--radius-s); overflow: hidden; background: var(--code-bg); }
    .prompt-bar { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 8px 8px 8px 16px; color: var(--code-ink); font-size: 13px; font-weight: 700; opacity: .95; }
    .prompt-bar .btn { background: var(--acc); color: #10202e; padding: 9px 13px; }
    .prompt pre { margin: 0; padding: 4px 16px 18px; white-space: pre-wrap; overflow-wrap: anywhere; color: var(--code-ink); font: 500 15px/1.65 var(--sans); }
    .prompt .ph { background: rgba(241, 214, 184, .22); color: #ffd9ae; border-radius: 4px; padding: 0 3px; }
    .say { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0 14px; }
    .say span { background: var(--acc-l); border-radius: 999px; padding: 7px 13px; font-size: 14px; font-weight: 600; }
    .say span::before { content: "💬 "; }

    /* ---------- приклад сайту в рамці телефона ---------- */
    .example { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 24px; align-items: center; background: var(--bg); border-radius: var(--radius); padding: 18px; margin: 14px 0 6px; max-width: 760px; }
    .phone { width: 280px; height: 560px; border-radius: 34px; padding: 10px; background: #14202b; box-shadow: var(--shadow); }
    .phone iframe { width: 100%; height: 100%; border: 0; border-radius: 25px; background: #fff; display: block; }
    .example-info { display: grid; gap: 8px; justify-items: start; min-width: 0; }
    .example-info b { font-size: 17px; }
    .example-info ul { margin: 0; }
    .example-info .more { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); }
    @media (max-width: 640px) {
      .example { grid-template-columns: minmax(0, 1fr); justify-items: center; padding: 14px; }
      .phone { width: min(280px, 100%); height: 520px; }
      .example-info { justify-items: stretch; }
    }

    /* ---------- скріни ---------- */
    figure { margin: 14px 0 20px; max-width: 760px; }
    figure img { display: block; width: 100%; border-radius: var(--radius-s); border: 1px solid var(--line); background: #fff; }
    figure.narrow { max-width: 520px; }
    figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; }
    .shot-slot { border: 2px dashed var(--line); border-radius: var(--radius-s); padding: 30px 16px; text-align: center; color: var(--muted); font-size: 14px; background: var(--bg); }
    .shot-slot::before { content: "🖼"; display: block; font-size: 26px; margin-bottom: 4px; }

    /* ---------- таблиці ---------- */
    .table-wrap { overflow-x: auto; margin: 12px 0 16px; max-width: 760px; }
    table { border-collapse: collapse; width: 100%; min-width: 460px; font-size: 15px; }
    th, td { text-align: left; padding: 11px 14px; border-bottom: 1px solid var(--line); vertical-align: top; }
    th { font: 800 12px var(--sans); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
    tbody tr:nth-child(odd) td { background: var(--bg); }
    td:first-child { font-weight: 700; }

    /* ---------- питання ---------- */
    details { border: 1px solid var(--line); border-radius: var(--radius-s); margin-bottom: 10px; background: var(--bg); max-width: 760px; }
    summary { cursor: pointer; font-weight: 700; padding: 14px 44px 14px 16px; list-style: none; position: relative; }
    summary::-webkit-details-marker { display: none; }
    summary::after { content: "+"; position: absolute; right: 16px; top: 50%; transform: translateY(-50%); font-size: 22px; color: var(--acc-d); transition: transform .2s; }
    details[open] summary::after { transform: translateY(-50%) rotate(45deg); }
    details > div { padding: 0 16px 14px; }
    details > div > :last-child { margin-bottom: 0; }

    /* ---------- галочки ---------- */
    .tasks { display: grid; gap: 8px; margin: 16px 0 0; max-width: 760px; }
    .tasks-title { font: 800 12px var(--sans); letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 18px 0 -6px; }
    .task { display: flex; gap: 12px; align-items: flex-start; cursor: pointer; background: var(--acc-l); border-radius: var(--radius-s); padding: 13px 16px; font-weight: 600; transition: background .15s; }
    .task input { position: absolute; opacity: 0; pointer-events: none; }
    .task .box { flex: none; width: 24px; height: 24px; border-radius: 50%; border: 2px solid var(--acc-d); display: grid; place-items: center; margin-top: 1px; transition: background .15s; }
    .task input:checked + .box { background: var(--acc-d); }
    .task input:checked + .box::after { content: "✓"; color: #fff; font-size: 14px; font-weight: 800; }
    .task input:checked ~ span:last-child { color: var(--muted); text-decoration: line-through; }
    .task input:focus-visible + .box { outline: 3px solid var(--acc); outline-offset: 2px; }

    /* ---------- кінець блоку ---------- */
    .finish { background: var(--code-bg); color: var(--code-ink); border-radius: var(--radius); padding: 26px; display: grid; gap: 14px; }
    .finish h3 { font: 600 30px/1.1 var(--serif); margin: 0; }
    .finish p { margin: 0; opacity: .9; }
    .finish .row { display: flex; flex-wrap: wrap; gap: 10px; }
    .finish .btn { background: var(--acc); color: #10202e; }
    .finish .btn.soft { background: rgba(255,255,255,.1); color: var(--code-ink); }

    .foot { border-top: 1px solid var(--line); padding: 26px 0 40px; color: var(--muted); font-size: 14px; text-align: center; }

    @media (max-width: 920px) {
      .layout { grid-template-columns: minmax(0, 1fr); gap: 20px; padding-top: 22px; }
      .outline { position: static; order: -1; }
      .outline-card { padding: 14px; }
      .outline nav { display: flex; overflow-x: auto; gap: 6px; padding-bottom: 4px; }
      .outline nav a { flex: none; background: var(--bg); border: 1px solid var(--line); white-space: nowrap; }
      .outline nav a.is-lesson { display: none; }
      .outline > .help { display: none; }
    }
    @media (max-width: 600px) {
      .container { padding: 0 16px; }
      .top .container { flex-wrap: wrap; }
      .overall .label { display: none; }
      .intro { padding: 22px 18px 20px; }
      .intro::after { font-size: 44px; right: 14px; top: 12px; }
      h1 { padding-right: 46px; }
      .step { padding: 18px 16px; }
      .step-head { gap: 12px; }
      .step-n { font-size: 32px; min-width: 36px; }
      .lesson-title { flex-direction: column; gap: 2px; }
    }
    @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }

    /* ---------- Формула Claude: доповнення ---------- */
    .step-n { font-size: 30px; min-width: 56px; }
    .step-head h3 { margin-top: 0; }
    .bcard.bonus small { color: var(--gold-d); }
    .lesson-chips { display: flex; flex-wrap: wrap; gap: 6px; }
    .chip.vid { background: var(--acc-l); color: var(--acc-dd); }
    .checkpoint { border: 1.5px solid var(--acc-d); border-radius: var(--radius); padding: 18px 20px; background: var(--bg-2); }
    .checkpoint > b { display: block; font: 600 24px/1.15 var(--serif); margin-bottom: 6px; }
    .checkpoint ul { margin: 0; padding-left: 22px; display: grid; gap: 6px; }
    .passport { border-left: 3px solid var(--acc-d); background: var(--acc-l); padding: 12px 16px; margin: 14px 0; max-width: 72ch; border-radius: 0 var(--radius-s) var(--radius-s) 0; }
    .passport > b { display: block; margin-bottom: 4px; }
    .passport > b::before { content: "🗂 "; }
    .passport p { margin: 0; }
    h1, .finish h3, .brand b { letter-spacing: .01em; }
    .cheat { background: var(--gold-l); border-radius: var(--radius-s); padding: 16px 18px 6px; margin: 18px 0 8px; max-width: 72ch; border-left: 4px solid var(--gold-d); }
    .cheat > b { display: block; margin-bottom: 8px; }
    .cheat li::marker { color: var(--gold-d); }
    .flow { display: inline-block; background: var(--acc-l); color: var(--acc-dd); border-radius: 12px; padding: 10px 14px; margin: 10px 0 14px; font-weight: 700; font-size: 15px; max-width: 72ch; }
    .flow::before { content: "↻ "; }
    .video { display: flex; align-items: center; gap: 8px; color: var(--muted); font-size: 13px; font-weight: 700; margin: -4px 0 12px; }
    .search { width: 100%; font: 500 14px var(--sans); color: var(--ink); background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
    .search:focus { outline: none; border-color: var(--acc-d); }
    .outline nav a small { display: block; color: var(--muted); font-size: 12px; }
    .outline nav .empty { color: var(--muted); font-size: 14px; padding: 6px 10px; }
    @media (min-width: 921px) { .outline-card { max-height: calc(100vh - 190px); overflow: auto; } }
    @media (max-width: 600px) { .step-n { font-size: 24px; min-width: 42px; } }
  </style>
</head>
<body>

<header class="top">
  <div class="container">
    <a class="brand" href="#" data-go="fc0"><b>Формула Claude</b><small>Конспект курсу · Неля Колесник</small></a>
    <div class="top-right">
      <div class="overall" title="Прогрес по всьому курсу"><span class="label">Увесь курс</span><div class="ring" id="ringAll"><span id="ringAllTxt">0%</span></div></div>
      <a class="help" href="https://t.me/hellppbott" target="_blank" rel="noopener">💬 Підтримка</a>
    </div>
  </div>
</header>

<div class="blocks" role="tablist" aria-label="Модулі курсу">
  <div class="container" id="blockCards"></div>
</div>

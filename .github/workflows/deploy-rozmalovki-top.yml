# Каталог розмальовок на власному домені → https://rozmalovki.top (папка /rozmalovki.top/www/ на хостингу)
# Той самий сайт, що rozmalovky.noosal.shop (папка rozmalovky/), але зі своїми ключами:
#   RT_PIXEL_ID          — Meta Pixel ID для rozmalovki.top (порожньо = піксель вимкнений)
#   RT_TG_BOT_TOKEN      — токен Telegram-бота, який надсилає заявки  } порожньо = заявки йдуть
#   RT_TG_CHAT_ID        — ID чату/групи для заявок                   } туди ж, куди з noosal.shop
#   RT_LPCRM_DOMAIN      — назва.lp-crm.biz (без https://)            } порожньо = без CRM
#   RT_LPCRM_KEY         — API-ключ LP-CRM                            }
#   RT_LPCRM_PRODUCT_ID  — ID товару «Розмальовка» в LP-CRM
#   RT_LPCRM_OFFICE      — ID офісу в LP-CRM (необов'язково)
# Секрети: GitHub → Settings → Secrets and variables → Actions → New repository secret.
# Ключі записуються в /rozmalovki.top/private/config.php (поза www, у репозиторії й логах їх немає).
# Запускається сам після змін у rozmalovky/ в main, або вручну: Actions → Deploy rozmalovki.top → Run workflow.
name: Deploy rozmalovki.top

on:
  push:
    branches: [main]
    paths:
      - "rozmalovky/**"
      - "api/rozmalovky-order.php"
      - "api/rozmalovky-data.php"
      - "api/lib.php"
      - ".github/workflows/deploy-rozmalovki-top.yml"
  workflow_dispatch:

concurrency:
  group: ftp-deploy-rozmalovki-top
  cancel-in-progress: false

env:
  SITE_ROOT: /rozmalovki.top
  DEPLOY_DIR: /rozmalovki.top/www/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      # Збираємо сайт: вміст rozmalovky/ у корінь домену + потрібні файли api/ (без бота-продавця noosal.shop)
      - name: Build
        env:
          RT_PIXEL_ID: ${{ secrets.RT_PIXEL_ID }}
        run: |
          mkdir -p _deploy/api
          cp -r rozmalovky/. _deploy/
          rm -f _deploy/*.md
          cp api/rozmalovky-order.php api/rozmalovky-data.php api/lib.php api/settings.php api/.htaccess _deploy/api/
          px=$(printf '%s' "$RT_PIXEL_ID" | tr -cd '0-9')
          sed -i -E "s/pixelId: \"[0-9]*\"/pixelId: \"${px}\"/" _deploy/products.js
          sed -i -E "s/var PIXEL_ID = \"[0-9]*\"/var PIXEL_ID = \"${px}\"/" _deploy/thanks.html
          echo "Meta Pixel: ${px:-вимкнений (додайте секрет RT_PIXEL_ID)}"
          grep -q "pixelId: \"${px}\"" _deploy/products.js && grep -q "PIXEL_ID = \"${px}\"" _deploy/thanks.html

      - name: Prepare sync state (first deploy)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          url="ftp://${FTP_SERVER}${DEPLOY_DIR}.ftp-deploy-sync-state.json"
          if curl -sS --ssl-reqd -u "${FTP_USERNAME}:${FTP_PASSWORD}" -o /dev/null "$url" 2>/dev/null; then
            echo "Sync state exists - regular deploy"
          else
            echo '{"description":"DO NOT DELETE THIS FILE. This file is used to keep track of which files have been synced in the most recent deployment.","version":"1.0.0","generatedTime":0,"data":[]}' > /tmp/state.json
            curl -sS --ssl-reqd --ftp-create-dirs -u "${FTP_USERNAME}:${FTP_PASSWORD}" -T /tmp/state.json "$url"
            echo "Empty sync state uploaded - first deploy"
          fi

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_deploy/
          server-dir: ${{ env.DEPLOY_DIR }}

      # Ключі → /rozmalovki.top/private/config.php. Поки свої RT_TG_* не задані — беремо Telegram з noosal.shop,
      # щоб заявки не губилися.
      - name: Private config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          RT_TG_BOT_TOKEN: ${{ secrets.RT_TG_BOT_TOKEN }}
          RT_TG_CHAT_ID: ${{ secrets.RT_TG_CHAT_ID }}
          RT_LPCRM_DOMAIN: ${{ secrets.RT_LPCRM_DOMAIN }}
          RT_LPCRM_KEY: ${{ secrets.RT_LPCRM_KEY }}
          RT_LPCRM_PRODUCT_ID: ${{ secrets.RT_LPCRM_PRODUCT_ID }}
          RT_LPCRM_OFFICE: ${{ secrets.RT_LPCRM_OFFICE }}
        shell: python
        run: |
          import os, io, re, base64, ftplib
          root = os.environ["SITE_ROOT"]
          ftp = ftplib.FTP_TLS(os.environ["FTP_SERVER"].strip(), timeout=60)
          ftp.login(os.environ["FTP_USERNAME"].strip(), os.environ["FTP_PASSWORD"])
          ftp.prot_p()

          def read(path):
              buf = io.BytesIO()
              try:
                  ftp.retrbinary(f"RETR {path}", buf.write)
              except ftplib.all_errors:
                  return {}
              return {k: base64.b64decode(v).decode() for k, v in
                      re.findall(r"'(\w+)' => base64_decode\('([A-Za-z0-9+/=]*)'\)", buf.getvalue().decode())}

          keys = read(f"{root}/private/config.php")
          env = lambda k: os.environ.get(k, "").strip()
          if env("RT_TG_BOT_TOKEN") and env("RT_TG_CHAT_ID"):
              keys["TG_BOT_TOKEN"], keys["TG_CHAT_ID"] = env("RT_TG_BOT_TOKEN"), env("RT_TG_CHAT_ID")
              print("Telegram: власний бот rozmalovki.top")
          elif not (keys.get("TG_BOT_TOKEN") and keys.get("TG_CHAT_ID")):
              shared = read("/noosal.shop/private/config.php")
              for k in ("TG_BOT_TOKEN", "TG_CHAT_ID"):
                  if shared.get(k):
                      keys[k] = shared[k]
              print("Telegram: тимчасово той самий чат, що noosal.shop")
          for k in ("LPCRM_DOMAIN", "LPCRM_KEY", "LPCRM_PRODUCT_ID", "LPCRM_OFFICE"):
              if env("RT_" + k):
                  keys[k] = env("RT_" + k)
          try:
              ftp.mkd(f"{root}/private")
          except ftplib.error_perm:
              pass
          b64 = lambda v: base64.b64encode(v.encode()).decode()
          php = "<?php\n// Згенеровано автоматично (deploy-rozmalovki-top.yml). Не редагуйте вручну.\nreturn [\n" + \
                "".join(f"    '{k}' => base64_decode('{b64(v)}'),\n" for k, v in keys.items() if v) + "];\n"
          ftp.storbinary(f"STOR {root}/private/config.php", io.BytesIO(php.encode()))
          ftp.storbinary(f"STOR {root}/private/.htaccess", io.BytesIO(b"Require all denied\n"))
          ftp.quit()
          print("private config:", ", ".join(k for k, v in keys.items() if v) or "порожньо")
          if not keys.get("TG_BOT_TOKEN"):
              print("::warning::Немає ключа Telegram — заявки не надсилатимуться. Додайте RT_TG_BOT_TOKEN і RT_TG_CHAT_ID")

# Сайт курсу «Формула свободи» → formula.kvn.kiev.ua (папка /kvn.kiev.ua/formula/ на хостингу)
# Піддомен створено в adm.tools: «Мої сайти» → kvn.kiev.ua → піддомен formula.
# Заявки: formula/index.html → api/formula-lead.php → Telegram.
# Ключ Telegram — спільний /kvn.kiev.ua/private/config.php (той самий, що для kvn.kiev.ua).
name: Deploy formula (formula.kvn.kiev.ua)

on:
  push:
    branches: [main]
    paths:
      - "formula/**"
      - "api/formula-lead.php"
      - "api/lib.php"
      - ".github/workflows/deploy-formula.yml"
  workflow_dispatch:

concurrency:
  group: ftp-deploy-formula
  cancel-in-progress: false

env:
  DEPLOY_DIR: /kvn.kiev.ua/formula/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Build
        run: |
          mkdir -p _deploy/api
          cp -r formula/. _deploy/
          cp api/formula-lead.php api/lib.php api/settings.php api/.htaccess _deploy/api/
          find _deploy -type f | sort

      - name: Prepare sync state (first deploy)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          url="ftp://${FTP_SERVER}${DEPLOY_DIR}.ftp-deploy-sync-state.json"
          if curl -sS --ssl-reqd -u "${FTP_USERNAME}:${FTP_PASSWORD}" -o /dev/null "$url" 2>/dev/null; then
            echo "Sync state exists - regular deploy"
          else
            echo '{"description":"DO NOT DELETE THIS FILE. This file is used to keep track of which files have been synced in the most recent deployment.","version":"1.0.0","generatedTime":0,"data":[]}' > /tmp/state.json
            curl -sS --ssl-reqd --ftp-create-dirs -u "${FTP_USERNAME}:${FTP_PASSWORD}" -T /tmp/state.json "$url"
            echo "Empty sync state uploaded - first deploy"
          fi

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_deploy/
          server-dir: ${{ env.DEPLOY_DIR }}

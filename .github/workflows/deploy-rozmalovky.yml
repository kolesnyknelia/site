# Каталог розмальовок → rozmalovky.noosal.shop (папка /noosal.shop/rozmalovky/ на хостингу)
# Запускається сам після змін магазину в main, або вручну: Actions → Deploy rozmalovky (rozmalovky.noosal.shop) → Run workflow.
# Інші сайти на noosal.shop не зачіпаються. Ключ Telegram — спільний для noosal.shop, його записує deploy-shop.yml
# у /noosal.shop/private/config.php (після додавання секретів TG_BOT_TOKEN / TG_CHAT_ID перезапустіть deploy-shop).
name: Deploy rozmalovky (rozmalovky.noosal.shop)

on:
  push:
    branches: [main]
    paths:
      - "rozmalovky/**"
      - "api/rozmalovky-order.php"
      - "api/lib.php"
      - ".github/workflows/deploy-rozmalovky.yml"
  workflow_dispatch:

concurrency:
  group: ftp-deploy-rozmalovky
  cancel-in-progress: false

env:
  DEPLOY_DIR: /noosal.shop/rozmalovky/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      # Збираємо сайт: вміст rozmalovky/ у корінь піддомену + потрібні файли api/
      - name: Build
        run: |
          mkdir -p _deploy/api
          cp -r rozmalovky/. _deploy/
          rm -f _deploy/*.md
          cp api/rozmalovky-order.php api/lib.php api/settings.php api/.htaccess _deploy/api/

      - name: Prepare sync state (first deploy)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          url="ftp://${FTP_SERVER}${DEPLOY_DIR}.ftp-deploy-sync-state.json"
          if curl -sS --ssl-reqd -u "${FTP_USERNAME}:${FTP_PASSWORD}" -o /dev/null "$url" 2>/dev/null; then
            echo "Sync state exists - regular deploy"
          else
            echo '{"description":"DO NOT DELETE THIS FILE. This file is used to keep track of which files have been synced in the most recent deployment.","version":"1.0.0","generatedTime":0,"data":[]}' > /tmp/state.json
            curl -sS --ssl-reqd --ftp-create-dirs -u "${FTP_USERNAME}:${FTP_PASSWORD}" -T /tmp/state.json "$url"
            echo "Empty sync state uploaded - first deploy"
          fi

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_deploy/
          server-dir: ${{ env.DEPLOY_DIR }}

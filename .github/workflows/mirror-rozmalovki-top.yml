# Тимчасово: завантажує повну копію rozmalovki.top (сайт власниці на іншому хостингу) у папку rozmalovkitop/
# і комітить її в цю гілку. Після перенесення workflow видаляється.
name: Mirror rozmalovki.top

on:
  push:
    branches: [claude/rozmalovki-website-fdc2kz]
    paths: [".github/workflows/mirror-rozmalovki-top.yml"]

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download
        run: |
          mkdir -p _m && cd _m
          wget -q --mirror --page-requisites --adjust-extension --no-parent -e robots=off \
               --user-agent="Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/130 Mobile Safari/537.36" \
               https://rozmalovki.top/ || true
          for p in thanks.html success.html spasibo.html robots.txt favicon.ico; do
            wget -q -x -e robots=off "https://rozmalovki.top/$p" || true
          done
          find . -type f -exec ls -la {} \; | awk '{print $5, $9}'
          # Зовнішні ресурси (щоб побачити, що ще підтягується з інших доменів)
          grep -rhoE '(src|href|action)="[^"]+"' rozmalovki.top | sort -u | head -100
      - name: Commit
        run: |
          rm -rf rozmalovkitop && mkdir rozmalovkitop
          cp -r _m/rozmalovki.top/. rozmalovkitop/
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add rozmalovkitop
          git commit -m "Копія rozmalovki.top у rozmalovkitop/ (автоматично)" || echo "nothing"
          git push

# Магазин «Тямко» → tyamko.noosal.shop (папка /noosal.shop/tyamko/ на хостингу)
# Запускається сам після змін магазину в main, або вручну: Actions → Deploy shop (tyamko.noosal.shop) → Run workflow.
# Інші сайти на noosal.shop (lak2, rozmalovka, sriblo…) не зачіпаються.
# Секрети ті самі: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD, TG_BOT_TOKEN, TG_CHAT_ID
name: Deploy shop (tyamko.noosal.shop)

on:
  push:
    branches: [main]
    paths:
      - "shop/**"
      - "api/shop-order.php"
      - "api/lib.php"
      - ".github/workflows/deploy-shop.yml"
  workflow_dispatch:

concurrency:
  group: ftp-deploy-shop
  cancel-in-progress: false

env:
  DEPLOY_DIR: /noosal.shop/tyamko/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      # Збираємо сайт: вміст shop/ у корінь піддомену + потрібні файли api/
      - name: Build
        run: |
          mkdir -p _deploy/api
          cp -r shop/. _deploy/
          rm -f _deploy/*.md
          cp api/shop-order.php api/lib.php api/settings.php api/.htaccess _deploy/api/

      - name: Prepare sync state (first deploy)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          url="ftp://${FTP_SERVER}${DEPLOY_DIR}.ftp-deploy-sync-state.json"
          if curl -sS --ssl-reqd -u "${FTP_USERNAME}:${FTP_PASSWORD}" -o /dev/null "$url" 2>/dev/null; then
            echo "Sync state exists - regular deploy"
          else
            echo '{"description":"DO NOT DELETE THIS FILE. This file is used to keep track of which files have been synced in the most recent deployment.","version":"1.0.0","generatedTime":0,"data":[]}' > /tmp/state.json
            curl -sS --ssl-reqd --ftp-create-dirs -u "${FTP_USERNAME}:${FTP_PASSWORD}" -T /tmp/state.json "$url"
            echo "Empty sync state uploaded - first deploy"
          fi

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_deploy/
          server-dir: ${{ env.DEPLOY_DIR }}

      # Токен Telegram → /noosal.shop/private/config.php (поза папками сайтів; api/lib.php читає його звідти)
      - name: Write private config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
        shell: python
        run: |
          import os, io, ftplib
          ftp = ftplib.FTP_TLS(os.environ["FTP_SERVER"].strip(), timeout=60)
          ftp.login(os.environ["FTP_USERNAME"].strip(), os.environ["FTP_PASSWORD"])
          ftp.prot_p()
          try:
              ftp.mkd("/noosal.shop/private")
          except ftplib.error_perm:
              pass
          esc = lambda v: v.replace("\\", "\\\\").replace("'", "\\'")
          keys = {k: os.environ.get(k, "").strip() for k in ("TG_BOT_TOKEN", "TG_CHAT_ID")}
          php = "<?php\nreturn [\n" + "".join(f"    '{k}' => '{esc(v)}',\n" for k, v in keys.items()) + "];\n"
          ftp.storbinary("STOR /noosal.shop/private/config.php", io.BytesIO(php.encode()))
          ftp.storbinary("STOR /noosal.shop/private/.htaccess", io.BytesIO(b"Require all denied\n"))
          ftp.quit()
          print("private config:", ", ".join(k for k, v in keys.items() if v) or "Telegram-секрети порожні")

# Перевірка зв'язку з SendPulse: ключі API, адресна книга, (опційно) тестовий email.
# Ключі в лог не виводяться — лише назва книги, кількість контактів і результат.
name: SendPulse check

on:
  workflow_dispatch:
    inputs:
      test_email:
        description: "Тестовий email, щоб додати в книгу (порожньо = лише перевірка)"
        default: ""

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          TEST_EMAIL: ${{ inputs.test_email }}
        shell: python
        run: |
          import os, io, re, json, base64, ftplib, urllib.request
          ftp = ftplib.FTP_TLS(os.environ["FTP_SERVER"].strip(), timeout=60)
          ftp.login(os.environ["FTP_USERNAME"].strip(), os.environ["FTP_PASSWORD"])
          ftp.prot_p(); buf = io.BytesIO()
          ftp.retrbinary("RETR /kvn.kiev.ua/private/config.php", buf.write); ftp.quit()
          cfg = {k: base64.b64decode(v).decode() for k, v in re.findall(r"'(\w+)' => base64_decode\('([A-Za-z0-9+/=]*)'\)", buf.getvalue().decode())}
          cid, sec, book = cfg.get("SP_CLIENT_ID", "").strip(), cfg.get("SP_CLIENT_SECRET", "").strip(), cfg.get("SP_BOOK_ID", "").strip()
          print("ID є:", bool(cid), "| Secret є:", bool(sec), "| Номер книги:", book or "—")

          def call(method, url, body=None, token=None):
              req = urllib.request.Request(url, method=method, data=json.dumps(body).encode() if body is not None else None,
                                           headers={"Content-Type": "application/json", **({"Authorization": f"Bearer {token}"} if token else {})})
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      return r.status, json.load(r)
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, json.load(e)
                  except Exception:
                      return e.code, {}

          code, r = call("POST", "https://api.sendpulse.com/oauth/access_token", {"grant_type": "client_credentials", "client_id": cid, "client_secret": sec})
          token = r.get("access_token")
          print("Вхід в API:", "✅" if token else f"❌ HTTP {code} {r.get('error_description') or r.get('message') or ''}")
          if token and book:
              code, r = call("GET", f"https://api.sendpulse.com/addressbooks/{book}", token=token)
              info = r[0] if isinstance(r, list) and r else r
              if code == 200 and isinstance(info, dict) and info.get("name"):
                  print(f"Книга: ✅ «{info.get('name')}», контактів: {info.get('all_email_qty')}")
              else:
                  print(f"Книга: ❌ HTTP {code} {info if isinstance(info, dict) else ''}")
              email = os.environ.get("TEST_EMAIL", "").strip()
              if email:
                  code, r = call("POST", f"https://api.sendpulse.com/addressbooks/{book}/emails", {"emails": [{"email": email, "variables": {"name": "Тест"}}]}, token)
                  print("Тестовий email додано:", "✅" if code == 200 and r.get("result") else f"❌ HTTP {code} {r}")

# Перевірка Telegram-сповіщень: який бот, у який чат пише, і чи доходить тестове повідомлення.
# Якщо чат не вказаний — бере чат, з якого боту останнім написали /start, і зберігає його.
# Показує лише @username бота і назву чату. Токен у лог не виводиться.
name: Telegram check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        shell: python
        run: |
          import os, io, re, json, base64, ftplib, urllib.request, urllib.parse
          ftp = ftplib.FTP_TLS(os.environ["FTP_SERVER"].strip(), timeout=60)
          ftp.login(os.environ["FTP_USERNAME"].strip(), os.environ["FTP_PASSWORD"])
          ftp.prot_p(); buf = io.BytesIO()
          ftp.retrbinary("RETR /kvn.kiev.ua/private/config.php", buf.write); ftp.quit()
          cfg = {k: base64.b64decode(v).decode() for k, v in re.findall(r"'(\w+)' => base64_decode\('([A-Za-z0-9+/=]*)'\)", buf.getvalue().decode())}
          token, chat = cfg.get("TG_BOT_TOKEN", ""), cfg.get("TG_CHAT_ID", "")
          print("Токен є:", bool(token), "| Чат є:", bool(chat))
          def api(method, **p):
              try:
                  data = urllib.parse.urlencode(p).encode() if p else None
                  with urllib.request.urlopen(f"https://api.telegram.org/bot{token}/{method}", data, timeout=20) as r:
                      return json.load(r)
              except urllib.error.HTTPError as e:
                  return json.load(e)
          if token:
              me = api("getMe")
              print("Бот:", "@" + me["result"]["username"] if me.get("ok") else me.get("description"))
          if token and not (chat and api("getChat", chat_id=chat).get("ok")):
              upd = api("getUpdates")
              chats = [u["message"]["chat"] for u in upd.get("result", []) if "message" in u]
              if chats:
                  chat = str(chats[-1]["id"]); cfg["TG_CHAT_ID"] = chat
                  KEYS = ["WFP_MERCHANT", "WFP_SECRET", "TG_BOT_TOKEN", "TG_CHAT_ID", "SP_CLIENT_ID", "SP_CLIENT_SECRET", "SP_BOOK_ID"]
                  php = "<?php\n// Згенеровано автоматично. Не редагуйте вручну.\nreturn [\n" + "".join(
                      f"    '{k}' => base64_decode('{base64.b64encode(cfg.get(k, '').encode()).decode()}'),\n" for k in KEYS) + "];\n"
                  ftp = ftplib.FTP_TLS(os.environ["FTP_SERVER"].strip(), timeout=60)
                  ftp.login(os.environ["FTP_USERNAME"].strip(), os.environ["FTP_PASSWORD"]); ftp.prot_p()
                  ftp.voidcmd("TYPE I")
                  with ftp.transfercmd("STOR /kvn.kiev.ua/private/config.php") as c:
                      c.sendall(php.encode()); c.settimeout(10)
                      try:
                          c.unwrap()  # хостинг не завжди відповідає на close_notify
                      except Exception:
                          pass
                  ftp.voidresp(); ftp.quit()
                  print("Чат знайдено через /start і збережено ✅")
              else:
                  print("Чат не знайдено: напишіть боту /start і запустіть перевірку ще раз",
                        "(" + str(upd.get("description")) + ")" if not upd.get("ok") else "")
          if token and chat:
              c = api("getChat", chat_id=chat)
              if c.get("ok"):
                  r = c["result"]
                  print("Чат:", r.get("type"), "|", r.get("title") or (r.get("first_name", "") + " " + r.get("last_name", "")).strip(), "|", "@" + r["username"] if r.get("username") else "")
              else:
                  print("Чат: помилка —", c.get("description"))
              m = api("sendMessage", chat_id=chat, text="🧪 Тест сповіщень з сайту kvn.kiev.ua")
              print("Тестове повідомлення:", "надіслано ✅" if m.get("ok") else "помилка — " + str(m.get("description")))

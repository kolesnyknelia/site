# Автоматична публікація сайту на хостинг через FTP
# після кожної зміни в гілці main.
# Секрети (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Deploy to hosting (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:   # ручний запуск: вкладка Actions → Run workflow

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # adm.tools: захищене з'єднання (FTP over TLS) — без нього хостинг рве передачу файлів
          protocol: ftps
          log-level: verbose
          local-dir: ./
          server-dir: /kvn.kiev.ua/www/
          # Не завантажуємо на сервер службові файли і внутрішні документи
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            backend/**
            README.md
            STRATEGY.md
            DEPLOY.md

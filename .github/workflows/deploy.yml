# Автоматична публікація сайту на хостинг через FTP
# після кожної зміни в гілці main.
# Секрети (Settings → Secrets and variables → Actions):
#   FTP_SERVER, FTP_USERNAME, FTP_PASSWORD
name: Deploy to hosting (FTP)

on:
  push:
    branches: [main]
  workflow_dispatch:   # ручний запуск: вкладка Actions → Run workflow

concurrency:
  group: ftp-deploy
  cancel-in-progress: false

env:
  # Папка сайту на хостингу (відносно кореня FTP-користувача)
  DEPLOY_DIR: /kvn.kiev.ua/www/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      # Перший деплой: FTP-Deploy-Action падає з ECONNRESET, коли на сервері ще немає
      # файлу стану синхронізації. Кладемо порожній файл стану, якщо його немає.
      - name: Prepare sync state (first deploy)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          url="ftp://${FTP_SERVER}${DEPLOY_DIR}.ftp-deploy-sync-state.json"
          if curl -sS --ssl-reqd -u "${FTP_USERNAME}:${FTP_PASSWORD}" -o /dev/null "$url" 2>/dev/null; then
            echo "Sync state exists - regular deploy"
          else
            echo '{"description":"DO NOT DELETE THIS FILE. This file is used to keep track of which files have been synced in the most recent deployment.","version":"1.0.0","generatedTime":0,"data":[]}' > /tmp/state.json
            curl -sS --ssl-reqd --ftp-create-dirs -u "${FTP_USERNAME}:${FTP_PASSWORD}" -T /tmp/state.json "$url"
            echo "Empty sync state uploaded - first deploy"
          fi

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          # adm.tools: захищене з'єднання (FTP over TLS) — без нього хостинг рве передачу файлів
          protocol: ftps
          log-level: verbose
          local-dir: ./
          server-dir: ${{ env.DEPLOY_DIR }}
          # Не завантажуємо на сервер службові файли і внутрішні документи
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            backend/**
            README.md
            STRATEGY.md
            DEPLOY.md
            PAYMENTS.md
            SENDPULSE_TASKS.md
            KONSPEKTY.md
            shop/*.md

      # Секретні ключі оплати/Telegram/SendPulse → /kvn.kiev.ua/private/config.php
      # (поза публічною папкою www; у репозиторії й логах їх немає).
      - name: Write private config
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          WFP_MERCHANT: ${{ secrets.WFP_MERCHANT }}
          WFP_SECRET: ${{ secrets.WFP_SECRET }}
          TG_BOT_TOKEN: ${{ secrets.TG_BOT_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          SP_CLIENT_ID: ${{ secrets.SP_CLIENT_ID }}
          SP_CLIENT_SECRET: ${{ secrets.SP_CLIENT_SECRET }}
          SP_BOOK_ID: ${{ secrets.SP_BOOK_ID }}
        shell: python
        run: |
          import os, io, re, base64, ftplib
          KEYS = ["WFP_MERCHANT", "WFP_SECRET", "TG_BOT_TOKEN", "TG_CHAT_ID", "SP_CLIENT_ID", "SP_CLIENT_SECRET", "SP_BOOK_ID"]
          base = os.environ["DEPLOY_DIR"].rstrip("/").rsplit("/", 1)[0]  # /kvn.kiev.ua
          path = f"{base}/private/config.php"
          ftp = ftplib.FTP_TLS(os.environ["FTP_SERVER"].strip(), timeout=60)
          ftp.login(os.environ["FTP_USERNAME"].strip(), os.environ["FTP_PASSWORD"])
          ftp.prot_p()

          def close_tls(c):
              c.settimeout(10)
              try:
                  c.unwrap()
              except Exception:
                  pass

          # Наявні значення (напр. імпортовані з іншого сайту) зберігаємо;
          # заповнені GitHub Secrets їх доповнюють або перезаписують.
          vals = {}
          try:
              ftp.voidcmd("TYPE I"); buf = io.BytesIO()
              with ftp.transfercmd(f"RETR {path}") as c:
                  while ch := c.recv(65536):
                      buf.write(ch)
                  close_tls(c)
              ftp.voidresp()
              for k, v in re.findall(r"'(\w+)' => base64_decode\('([A-Za-z0-9+/=]*)'\)", buf.getvalue().decode()):
                  vals[k] = base64.b64decode(v).decode()
          except ftplib.all_errors:
              pass
          for k in KEYS:
              v = os.environ.get(k, "").strip()
              if v:
                  vals[k] = v

          b64 = lambda v: base64.b64encode(v.encode()).decode()
          php = "<?php\n// Згенеровано автоматично. Не редагуйте вручну.\nreturn [\n" + \
                "".join(f"    '{k}' => base64_decode('{b64(vals.get(k, ''))}'),\n" for k in KEYS) + "];\n"
          print("Заповнено:", ", ".join(k for k in KEYS if vals.get(k)) or "нічого")
          print("Порожні:", ", ".join(k for k in KEYS if not vals.get(k)) or "—")
          try:
              ftp.mkd(f"{base}/private")
          except ftplib.error_perm:
              pass
          ftp.voidcmd("TYPE I")
          with ftp.transfercmd(f"STOR {path}") as c:
              c.sendall(php.encode()); close_tls(c)
          ftp.voidresp()
          ftp.quit()
          print("config.php оновлено")

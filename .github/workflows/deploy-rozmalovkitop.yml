# Копія сайту rozmalovki.top (сайт власниці) → https://rozmalovkitop.noosal.shop (папка /noosal.shop/rozmalovkitop/)
# Файли — у папці rozmalovkitop/. Заявки: rozmalovkitop/api/order.php →
#   • Telegram — спільний ключ noosal.shop (/noosal.shop/private/config.php);
#   • LP-CRM — товар ID 147. Ключ, домен, офіс і тип оплати LP-CRM копіюються сервер→сервер з вашого робочого сайту
#     (input lpcrm_source) у /noosal.shop/private/config.php — у репозиторії й логах їх немає.
#   • Meta Pixel — rozmalovkitop/js/config.js → pixelId.
# Піддомен один раз: adm.tools → «Мої сайти» → noosal.shop → «Додати піддомен» → rozmalovkitop, + SSL (Let's Encrypt).
name: Deploy rozmalovkitop (rozmalovkitop.noosal.shop)

on:
  push:
    branches: [main]
    paths:
      - "rozmalovkitop/**"
      - "api/lib.php"
      - ".github/workflows/deploy-rozmalovkitop.yml"
  workflow_dispatch:
    inputs:
      lpcrm_source:
        description: "Файл на хостингу, де LP-CRM уже працює (звідти беремо ключ)"
        default: "/noosal.shop/sriblo/upsell.php"

concurrency:
  group: ftp-deploy-rozmalovkitop
  cancel-in-progress: false

env:
  DEPLOY_DIR: /noosal.shop/rozmalovkitop/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      # Сайт = вміст rozmalovkitop/ + спільний api/lib.php (Telegram, ключі з private/config.php)
      - name: Build
        run: |
          mkdir -p _deploy
          cp -r rozmalovkitop/. _deploy/
          cp api/lib.php _deploy/api/
          rm -f _deploy/README.md
          ls -R _deploy

      - name: Prepare sync state (first deploy)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          url="ftp://${FTP_SERVER}${DEPLOY_DIR}.ftp-deploy-sync-state.json"
          if curl -sS --ssl-reqd -u "${FTP_USERNAME}:${FTP_PASSWORD}" -o /dev/null "$url" 2>/dev/null; then
            echo "Sync state exists - regular deploy"
          else
            echo '{"description":"DO NOT DELETE THIS FILE. This file is used to keep track of which files have been synced in the most recent deployment.","version":"1.0.0","generatedTime":0,"data":[]}' > /tmp/state.json
            curl -sS --ssl-reqd --ftp-create-dirs -u "${FTP_USERNAME}:${FTP_PASSWORD}" -T /tmp/state.json "$url"
            echo "Empty sync state uploaded - first deploy"
          fi

      - name: Upload via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_deploy/
          server-dir: ${{ env.DEPLOY_DIR }}

      # LP-CRM: ключі з робочого сайту → /noosal.shop/private/config.php (інші ключі, зокрема Telegram, зберігаються)
      - name: LP-CRM keys
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SRC: ${{ inputs.lpcrm_source || '/noosal.shop/sriblo/upsell.php' }}
        shell: python
        run: |
          import os, io, re, base64, ftplib
          ftp = ftplib.FTP_TLS(os.environ["FTP_SERVER"].strip(), timeout=60)
          ftp.login(os.environ["FTP_USERNAME"].strip(), os.environ["FTP_PASSWORD"])
          ftp.prot_p()

          def get(p):
              buf = io.BytesIO()
              ftp.retrbinary(f"RETR {p}", buf.write)
              return buf.getvalue().decode("utf-8", "replace")

          CFG = "/noosal.shop/private/config.php"
          try:
              keys = {k: base64.b64decode(v).decode() for k, v in
                      re.findall(r"'(\w+)' => base64_decode\('([A-Za-z0-9+/=]*)'\)", get(CFG))}
          except ftplib.all_errors as e:
              # Не перезаписуємо конфіг, якщо не змогли його прочитати — інакше загубимо ключ Telegram
              print(f"::warning::Не вдалося прочитати {CFG}: {e}. LP-CRM не підключено")
              raise SystemExit(0)
          print("Telegram:", "є" if keys.get("TG_BOT_TOKEN") and keys.get("TG_CHAT_ID") else "НЕМАЄ — заявки не надсилатимуться")

          src = os.environ["SRC"].strip()
          try:
              s = get(src)
          except ftplib.all_errors as e:
              print(f"::warning::Не вдалося прочитати {src}: {e}. LP-CRM не підключено")
              raise SystemExit(0)
          found = {}
          for k, name in (("crm_key", "LPCRM_KEY"), ("crm_url", "LPCRM_DOMAIN"), ("crm_office", "LPCRM_OFFICE"), ("crm_payment", "LPCRM_PAYMENT")):
              m = re.search(r"\$" + k + r"\s*=\s*'([^']+)'", s)
              if m:
                  found[name] = m.group(1)
          if "LPCRM_DOMAIN" not in found:
              m = re.search(r"([a-z0-9\-]+\.lp-crm\.[a-z]+)", s)
              if m:
                  found["LPCRM_DOMAIN"] = m.group(1)
          if "LPCRM_DOMAIN" in found:
              found["LPCRM_DOMAIN"] = re.sub(r"^https?://|/.*$", "", found["LPCRM_DOMAIN"])
          if not found.get("LPCRM_KEY") or not found.get("LPCRM_DOMAIN"):
              print(f"::warning::У {src} не знайдено ключ або домен LP-CRM. LP-CRM не підключено")
              raise SystemExit(0)
          keys.update(found)
          print("LP-CRM:", found["LPCRM_DOMAIN"], "| office", found.get("LPCRM_OFFICE", "-"),
                "| payment", found.get("LPCRM_PAYMENT", "-"), "| key: знайдено (не показується)")

          b64 = lambda v: base64.b64encode(v.encode()).decode()
          php = "<?php\n// Згенеровано автоматично. Не редагуйте вручну.\nreturn [\n" + \
                "".join(f"    '{k}' => base64_decode('{b64(v)}'),\n" for k, v in keys.items() if v) + "];\n"
          ftp.storbinary(f"STOR {CFG}", io.BytesIO(php.encode()))
          ftp.quit()
          print("private config:", ", ".join(k for k, v in keys.items() if v))

# Автодеплой конспекту курсу на https://konspektsayt.kvn.kiev.ua
# Після змін у konspekt/ в гілці main вміст konspekt/ (без вихідників скіла)
# завантажується в папку піддомену. Архів скіла збирається тут же зі свіжих файлів.
# Секрети ті самі, що й для основного сайту: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD.
# + KONSPEKT_KEY — секретна частина посилання на конспект (лише латиниця, цифри, - і _).
# + KONSPEKT_ADMIN_PASS — пароль кабінету admin.php (учні, пристрої, захист).
name: Deploy konspekt (konspektsayt.kvn.kiev.ua)

on:
  push:
    branches: [main]
    paths:
      - "konspekt/**"
      - ".github/workflows/deploy-konspekt.yml"
  workflow_dispatch:

concurrency:
  group: ftp-deploy-konspekt
  cancel-in-progress: false

env:
  # Папка піддомену на хостингу (відносно кореня FTP-користувача)
  DEPLOY_DIR: /kvn.kiev.ua/konspektsayt/

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Get code
        uses: actions/checkout@v4

      # Збираємо сайт. Конспект лежить у секретній папці (секрет KONSPEKT_KEY),
      # тож відкривається лише за повним посиланням з SendPulse:
      #   https://konspektsayt.kvn.kiev.ua/<KONSPEKT_KEY>/
      # У корені — заглушка «Сторінку не знайдено», robots.txt і заборона індексації.
      # Без секрету конспект кладемо в корінь (як раніше) і попереджаємо.
      - name: Build
        env:
          KONSPEKT_KEY: ${{ secrets.KONSPEKT_KEY }}
          ADMIN_PASS: ${{ secrets.KONSPEKT_ADMIN_PASS }}
        run: |
          key=$(printf '%s' "$KONSPEKT_KEY" | tr -cd 'A-Za-z0-9_-')
          mkdir -p _deploy
          if [ -n "$key" ]; then
            cp -r konspekt/root/. _deploy/
            dest="_deploy/$key"
            echo "Конспект: https://konspektsayt.kvn.kiev.ua/<KONSPEKT_KEY>/"
          else
            dest="_deploy"
            cp konspekt/root/robots.txt konspekt/root/.htaccess _deploy/
            echo "::warning::Секрет KONSPEKT_KEY не задано — конспект відкривається за адресою піддомену без секретної частини"
          fi
          # Вхід за кодом з пошти (konspekt/gate): сам конспект, скріни й файли — у private/,
          # з браузера напряму недоступні, віддаються лише через index.php після входу.
          # Поки в кабінеті (admin.php) захист вимкнено — конспект відкривається як раніше.
          priv="$dest/private"
          mkdir -p "$priv/files" "$priv/img"
          cp konspekt/gate/index.php konspekt/gate/admin.php konspekt/gate/lib.php "$dest/"
          cp konspekt/gate/htaccess "$dest/.htaccess"
          cp konspekt/gate/private-htaccess "$priv/.htaccess"
          cp konspekt/index.html "$priv/konspekt.html"
          cp -r konspekt/files/. "$priv/files/"
          cp -r konspekt/img/. "$priv/img/" 2>/dev/null || true
          rm -f "$priv/files/sait-pid-tovar.zip"
          (cd konspekt/skill && zip -rq -X "$GITHUB_WORKSPACE/$priv/files/sait-pid-tovar.zip" sait-pid-tovar)
          # Кожен файл → «назва.php» з «<?php exit; ?>» на початку: напряму не відкривається навіть в обхід .htaccess
          for f in "$priv/konspekt.html" "$priv"/img/* "$priv"/files/*; do
            [ -f "$f" ] || continue
            { printf '<?php exit; ?>\n'; cat "$f"; } > "$f.php" && rm "$f"
          done
          # Пароль кабінету — із секрету KONSPEKT_ADMIN_PASS, лише в private/config.php на хостингу
          KONSPEKT_ADMIN_PASS="$ADMIN_PASS" php -r 'echo "<?php return " . var_export(["admin_pass" => (string)getenv("KONSPEKT_ADMIN_PASS")], true) . ";\n";' > "$priv/config.php"
          if [ -z "$ADMIN_PASS" ]; then echo "::warning::Секрет KONSPEKT_ADMIN_PASS не задано — кабінет admin.php недоступний, захист не ввімкнути"; fi
          find _deploy -name '.gitkeep' -delete
          if [ -n "$key" ]; then find _deploy -type f | sed "s|$key|<KEY>|" | sort; else find _deploy -type f | sort; fi

      - name: Prepare sync state (first deploy)
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          url="ftp://${FTP_SERVER}${DEPLOY_DIR}.ftp-deploy-sync-state.json"
          if curl -sS --ssl-reqd -u "${FTP_USERNAME}:${FTP_PASSWORD}" -o /dev/null "$url" 2>/dev/null; then
            echo "Sync state exists - regular deploy"
          else
            echo '{"description":"DO NOT DELETE THIS FILE. This file is used to keep track of which files have been synced in the most recent deployment.","version":"1.0.0","generatedTime":0,"data":[]}' > /tmp/state.json
            curl -sS --ssl-reqd --ftp-create-dirs -u "${FTP_USERNAME}:${FTP_PASSWORD}" -T /tmp/state.json "$url"
            echo "Empty sync state uploaded - first deploy"
          fi

      # Хостинг іноді обриває FTP-з'єднання посеред завантаження — тоді пробуємо ще раз
      - name: Upload via FTP
        id: upload
        continue-on-error: true
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_deploy/
          server-dir: ${{ env.DEPLOY_DIR }}

      - name: Wait before retry
        if: steps.upload.outcome == 'failure'
        run: sleep 30

      - name: Upload via FTP (retry)
        if: steps.upload.outcome == 'failure'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./_deploy/
          server-dir: ${{ env.DEPLOY_DIR }}

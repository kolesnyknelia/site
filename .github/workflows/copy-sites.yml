# КОПІЮВАННЯ сайтів з одного домену в kvn.kiev.ua (на тому ж хостингу).
# Нічого не видаляє: оригінали лишаються на місці.
# Додатково робить резервну копію в /_backup/<домен>/ на хостингу.
# Запуск: Actions → Copy sites to kvn.kiev.ua → Run workflow
name: Copy sites to kvn.kiev.ua

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Домен, з якого копіюємо (напр. shopnash.website)"
        required: true
      sites:
        description: "Які піддомени (через пробіл). Порожньо = всі, крім www"
        required: false
        default: ""
      target:
        description: "Куди копіюємо"
        required: true
        default: "kvn.kiev.ua"
      overwrite:
        description: "Перезаписати, якщо папка в kvn.kiev.ua вже є (yes/no)"
        required: false
        default: "no"

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SRC: ${{ inputs.source }}
          SITES: ${{ inputs.sites }}
          DST: ${{ inputs.target }}
          OVERWRITE: ${{ inputs.overwrite }}
          PYTHONUNBUFFERED: "1"
        shell: python
        run: |
          import os, io, ftplib, ssl

          import time

          def connect():
              f = ftplib.FTP_TLS(os.environ["FTP_SERVER"].strip(), timeout=30)
              f.login(os.environ["FTP_USERNAME"].strip(), os.environ["FTP_PASSWORD"])
              f.prot_p()
              f.encoding = "latin-1"  # імена файлів передаємо байт-в-байт
              return f

          ftp = connect()

          # Хостинг не завжди відповідає на TLS close_notify, тому стандартні
          # retrbinary/storbinary зависають. Закриваємо коректно, але чекаємо недовго.
          def _close_tls(conn):
              conn.settimeout(10)
              try:
                  conn.unwrap()
              except Exception:
                  pass

          def retr(path):
              ftp.voidcmd("TYPE I")
              buf = io.BytesIO()
              with ftp.transfercmd(f"RETR {path}") as conn:
                  while chunk := conn.recv(65536):
                      buf.write(chunk)
                  _close_tls(conn)
              ftp.voidresp()
              return buf.getvalue()

          def stor(path, data):
              global ftp
              for attempt in range(3):
                  try:
                      ftp.voidcmd("TYPE I")
                      with ftp.transfercmd(f"STOR {path}") as conn:
                          conn.sendall(data)
                          _close_tls(conn)
                      ftp.voidresp()
                      return
                  except ftplib.all_errors as e:
                      print(f"     ! {path}: {e} — спроба {attempt + 2}/3")
                      time.sleep(3)
                      try:
                          ftp.close()
                      except Exception:
                          pass
                      ftp = connect()
              raise RuntimeError(f"Не вдалося записати {path}")
          SRC = os.environ["SRC"].strip().strip("/")
          DST = os.environ["DST"].strip().strip("/")

          def listdir(path):
              out = []
              for name, facts in ftp.mlsd(path, facts=["type"]):
                  if name in (".", "..") or facts.get("type") not in ("file", "dir"):
                      continue
                  out.append((name, facts["type"]))
              return out

          def read_tree(path):
              """{relpath: bytes} для всіх файлів у path"""
              files = {}
              def walk(rel):
                  for name, t in listdir(f"{path}/{rel}".rstrip("/")):
                      r = f"{rel}/{name}".lstrip("/")
                      if t == "dir":
                          files[r + "/"] = None
                          walk(r)
                      else:
                          files[r] = retr(f"{path}/{r}")
              walk("")
              return files

          def ensure_dir(path):
              cur = ""
              for part in path.strip("/").split("/"):
                  cur += "/" + part
                  try:
                      ftp.mkd(cur)
                  except ftplib.error_perm:
                      pass

          def write_tree(path, files):
              ensure_dir(path)
              for r in sorted(files):
                  if files[r] is None:
                      ensure_dir(f"{path}/{r}")
              for r, data in files.items():
                  if data is not None:
                      stor(f"{path}/{r}", data)
                      print(f"     + {path}/{r}")

          def exists_nonempty(path):
              try:
                  return len(listdir(path)) > 0
              except ftplib.all_errors:
                  return False

          print(f"== Читаю /{SRC}")
          sites = [n for n, t in listdir(f"/{SRC}") if t == "dir"]
          wanted = os.environ.get("SITES", "").split() or [s for s in sites if s != "www"]

          for s in wanted:
              if s not in sites:
                  print(f"!! {s} не знайдено в /{SRC}, пропускаю"); continue
              tree = read_tree(f"/{SRC}/{s}")
              size = sum(len(v) for v in tree.values() if v)
              print(f"== {s}: {sum(1 for v in tree.values() if v is not None)} файлів, {size//1024} KB")
              write_tree(f"/_backup/{SRC}/{s}", tree)
              print(f"   резервна копія -> /_backup/{SRC}/{s}")
              if os.environ.get("OVERWRITE", "no").strip().lower() != "yes" and exists_nonempty(f"/{DST}/{s}"):
                  print(f"!! /{DST}/{s} вже існує і не порожня — НЕ перезаписую"); continue
              write_tree(f"/{DST}/{s}", tree)
              print(f"   скопійовано -> /{DST}/{s}  (буде {s}.{DST})")

          print(f"== Готово. Папки в /{DST}:", sorted(n for n, t in listdir(f"/{DST}") if t == "dir"))
          ftp.quit()

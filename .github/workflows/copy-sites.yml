# КОПІЮВАННЯ сайтів з одного домену в kvn.kiev.ua (на тому ж хостингу).
# Нічого не видаляє: оригінали лишаються на місці.
# Додатково робить резервну копію в /_backup/<домен>/ на хостингу.
# Запуск: Actions → Copy sites to kvn.kiev.ua → Run workflow
name: Copy sites to kvn.kiev.ua

on:
  workflow_dispatch:
    inputs:
      source:
        description: "Домен, з якого копіюємо (напр. shopnash.website)"
        required: true
      sites:
        description: "Які піддомени (через пробіл). Порожньо = всі, крім www"
        required: false
        default: ""
      target:
        description: "Куди копіюємо"
        required: true
        default: "kvn.kiev.ua"
      overwrite:
        description: "Перезаписати, якщо папка в kvn.kiev.ua вже є (yes/no)"
        required: false
        default: "no"
      backup:
        description: "Робити резервну копію в /_backup (yes/no)"
        required: false
        default: "yes"

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy via FTPS
        env:
          FTP_SERVER: ${{ secrets.FTP_SERVER }}
          FTP_USERNAME: ${{ secrets.FTP_USERNAME }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
          SRC: ${{ inputs.source }}
          SITES: ${{ inputs.sites }}
          DST: ${{ inputs.target }}
          OVERWRITE: ${{ inputs.overwrite }}
          BACKUP: ${{ inputs.backup }}
          PYTHONUNBUFFERED: "1"
        shell: python
        run: |
          import os, io, ftplib, time

          SRC = os.environ["SRC"].strip().strip("/")
          DST = os.environ["DST"].strip().strip("/")
          OVERWRITE = os.environ.get("OVERWRITE", "no").strip().lower() == "yes"
          BACKUP = os.environ.get("BACKUP", "yes").strip().lower() == "yes"

          def connect():
              f = ftplib.FTP_TLS(os.environ["FTP_SERVER"].strip(), timeout=60)
              f.login(os.environ["FTP_USERNAME"].strip(), os.environ["FTP_PASSWORD"])
              f.prot_p()
              f.encoding = "latin-1"  # імена файлів передаємо байт-в-байт
              return f

          ftp = connect()

          def retry(fn):
              """Виконати дію; при збої з'єднання — перепідключитись і повторити (до 5 разів)."""
              global ftp
              for attempt in range(5):
                  try:
                      return fn()
                  except (ftplib.error_temp, ftplib.error_reply, OSError, EOFError) as e:
                      print(f"     ! збій ({e}), перепідключаюсь… {attempt + 1}/5")
                      time.sleep(5)
                      try:
                          ftp.close()
                      except Exception:
                          pass
                      ftp = connect()
              raise RuntimeError("Хостинг не відповідає після 5 спроб")

          # Хостинг не завжди відповідає на TLS close_notify — закриваємо, але чекаємо недовго.
          def _close_tls(conn):
              conn.settimeout(10)
              try:
                  conn.unwrap()
              except Exception:
                  pass

          def retr(path):
              def go():
                  ftp.voidcmd("TYPE I")
                  buf = io.BytesIO()
                  with ftp.transfercmd(f"RETR {path}") as conn:
                      while chunk := conn.recv(65536):
                          buf.write(chunk)
                      _close_tls(conn)
                  ftp.voidresp()
                  return buf.getvalue()
              return retry(go)

          def stor(path, data):
              def go():
                  ftp.voidcmd("TYPE I")
                  with ftp.transfercmd(f"STOR {path}") as conn:
                      conn.sendall(data)
                      _close_tls(conn)
                  ftp.voidresp()
              retry(go)

          def listdir(path):
              """[(name, type, size)]; порожньо, якщо папки немає."""
              def go():
                  return [(n, f.get("type"), int(f.get("size", 0) or 0))
                          for n, f in ftp.mlsd(path, facts=["type", "size"])
                          if n not in (".", "..") and f.get("type") in ("file", "dir")]
              try:
                  return retry(go)
              except ftplib.error_perm:
                  return []

          def mkdir(path):
              try:
                  retry(lambda: ftp.mkd(path))
              except ftplib.error_perm:
                  pass  # вже існує

          def sync(src, dst):
              """Копіює src -> dst; файли, які вже є з тим самим розміром, пропускає."""
              copied = skipped = 0
              mkdir(dst)
              have = {n: (t, sz) for n, t, sz in listdir(dst)}
              for name, t, size in listdir(src):
                  if t == "dir":
                      c, k = sync(f"{src}/{name}", f"{dst}/{name}")
                      copied += c; skipped += k
                  elif have.get(name) == ("file", size):
                      skipped += 1
                  else:
                      stor(f"{dst}/{name}", retr(f"{src}/{name}"))
                      copied += 1
                      if copied % 25 == 0:
                          print(f"     … {dst}: скопійовано {copied}")
              return copied, skipped

          print(f"== Читаю /{SRC}")
          sites = [n for n, t, _ in listdir(f"/{SRC}") if t == "dir"]
          wanted = os.environ.get("SITES", "").split() or [x for x in sites if x != "www"]

          for site in wanted:
              if site not in sites:
                  print(f"!! {site} не знайдено в /{SRC}, пропускаю"); continue
              if BACKUP:
                  c, k = sync(f"/{SRC}/{site}", f"/_backup/{SRC}/{site}")
                  print(f"== {site}: резервна копія /_backup/{SRC}/{site} (нових {c}, вже було {k})")
              if not OVERWRITE and listdir(f"/{DST}/{site}"):
                  print(f"!! /{DST}/{site} вже існує — пропускаю (overwrite=yes, щоб докопіювати)"); continue
              c, k = sync(f"/{SRC}/{site}", f"/{DST}/{site}")
              print(f"== {site} -> /{DST}/{site}: скопійовано {c}, вже було {k}  (буде {site}.{DST})")

          print(f"== Готово. Папки в /{DST}:", sorted(n for n, t, _ in listdir(f"/{DST}") if t == "dir"))
          ftp.quit()

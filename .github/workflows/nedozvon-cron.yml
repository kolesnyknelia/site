# Запуск бота «Недозвон» (cron.php) — запасний варіант до cron на хостингу:
# кожні 5 хвилин (GitHub може запізнюватися на кілька хвилин) і вручну: Actions → Nedozvon cron → Run workflow.
# Секрет NZ_SECRET у лог не потрапляє.
name: Nedozvon cron

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: nedozvon-cron
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Run cron.php
        env:
          KEY: ${{ secrets.NZ_SECRET }}
        run: curl -sS --max-time 240 "https://kvn.kiev.ua/nedozvon/cron.php?key=${KEY}" || true

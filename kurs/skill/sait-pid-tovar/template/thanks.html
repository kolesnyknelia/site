<!doctype html>
<html lang="uk">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Дякуємо за замовлення!</title>
  <meta name="robots" content="noindex">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🎉</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;800&family=Unbounded:wght@700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js"></script>
  <style>
    .thanks { min-height: 100vh; display: grid; place-items: center; padding: 32px 16px; }
    .thanks-box { max-width: 480px; width: 100%; text-align: center; background: var(--card); border-radius: var(--r); padding: 34px 22px; box-shadow: var(--shadow); }
    .big { font-size: 64px; line-height: 1; margin-bottom: 12px; }
    .sumline { background: var(--accent-l); border-radius: var(--r-s); padding: 14px; margin: 18px 0; }
    .sumline b { font-family: var(--head); color: var(--accent); }
    .muted { color: var(--ink-2); font-size: 14px; }
  </style>
</head>
<body>
  <main class="thanks">
    <div class="thanks-box">
      <div class="big">🎉</div>
      <h1>Дякуємо! Замовлення прийнято</h1>
      <p>Менеджер зателефонує вам найближчим часом, щоб підтвердити замовлення й уточнити адресу Нової пошти.</p>
      <div class="sumline" id="sumline" hidden>Сума: <b><span id="sum">0</span> грн</b> + доставка<br><small class="muted">Номер заявки: <span id="ref"></span></small></div>
      <p class="muted">Тримайте телефон поруч 🙂 Дзвонимо з українського номера.</p>
      <a class="btn" href="index.html">Повернутися на сайт</a>
    </div>
  </main>
  <script>
    (function () {
      var S = window.SITE || {}, q = new URLSearchParams(location.search);
      var ref = (q.get("ref") || "").replace(/[^\w-]/g, "").slice(0, 40), sum = +q.get("sum") || 0;
      if (ref) {
        document.getElementById("sumline").hidden = false;
        document.getElementById("sum").textContent = sum;
        document.getElementById("ref").textContent = ref;
      }
      var px = String(S.pixelId || "").replace(/\D/g, "");
      if (!px) return;
      !function (f, b, e, v, n, t, s) { if (f.fbq) return; n = f.fbq = function () { n.callMethod ? n.callMethod.apply(n, arguments) : n.queue.push(arguments); }; if (!f._fbq) f._fbq = n; n.push = n; n.loaded = !0; n.version = "2.0"; n.queue = []; t = b.createElement(e); t.async = !0; t.src = v; s = b.getElementsByTagName(e)[0]; s.parentNode.insertBefore(t, s); }(window, document, "script", "https://connect.facebook.net/en_US/fbevents.js");
      fbq("init", px); fbq("track", "PageView");
      // Покупка — один раз на заявку, навіть якщо сторінку оновили
      var key = "px_purchase_" + ref, done = false;
      try { done = !!localStorage.getItem(key); } catch (e) {}
      if (ref && !done) {
        fbq("track", "Purchase", { value: sum, currency: "UAH", content_name: S.product, num_items: +q.get("qty") || 1 }, { eventID: ref });
        try { localStorage.setItem(key, "1"); } catch (e) {}
      }
    })();
  </script>
</body>
</html>
